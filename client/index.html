<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23000000'><path d='M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1V9.5z'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <title>EstateFlow AI | Real Estate WhatsApp CRM & Automation</title>
  </head>
  <body class="bg-zinc-50 text-zinc-900 antialiased selection:bg-zinc-950 selection:text-white">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #09090b; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 24px; text-align: center;">
        <div style="width: 44px; height: 44px; border-radius: 12px; background-color: #18181b; display: flex; align-items: center; justify-content: center; margin-bottom: 16px; border: 1px solid #27272a;">
          <svg style="width: 22px; height: 22px; fill: none; stroke: #ffffff; stroke-width: 2;" viewBox="0 0 24 24"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1V9.5z"/></svg>
        </div>
        <div style="font-weight: 700; font-size: 18px; letter-spacing: -0.025em; margin-bottom: 4px;">EstateFlow CRM</div>
        <div style="font-size: 12px; color: #a1a1aa; margin-bottom: 16px;">Real Estate WhatsApp CRM & Automation</div>
        <div style="width: 140px; height: 3px; background-color: #27272a; border-radius: 9999px; overflow: hidden; position: relative;">
          <div style="width: 50%; height: 100%; background-color: #ffffff; border-radius: 9999px; animation: pulse 1.2s infinite ease-in-out;"></div>
        </div>
      </div>
    </div>
    <script>
      window.addEventListener('error', function(e) {
        var root = document.getElementById('root');
        if (root && (!root.children.length || root.innerHTML.indexOf('Loading') !== -1)) {
          root.innerHTML = '<div style="min-height:100vh;padding:32px 20px;font-family:sans-serif;background:#ffffff;color:#18181b;"><h2 style="font-size:18px;font-weight:700;margin-bottom:8px;">Application Notice</h2><p style="font-size:13px;color:#52525b;line-height:1.5;">' + (e.message || 'Error initializing application') + '</p><div style="margin-top:16px;"><button onclick="window.location.reload()" style="padding:8px 16px;background:#18181b;color:#fff;border:none;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;">Retry</button></div></div>';
        }
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
